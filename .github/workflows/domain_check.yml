name: Verificación Automática de Dominios

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Ejecuta cada 6 horas

jobs:
  check_domains:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper pycryptodome

      - name: Ejecutar DomainCheck.py
        run: python DomainCheck.py

      - name: Comprobar Cambios
        id: check_diff
        run: |
          git diff --quiet . || echo "has_changes=true" >> $GITHUB_OUTPUT || true

      - name: Guardar y Enviar Cambios de Dominio
        if: steps.check_diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🔄 Actualización Automática de Dominios" \
            -m "Los dominios redirigidos han sido actualizados y las versiones incrementadas automáticamente."
          git push origin main
